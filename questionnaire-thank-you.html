<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | FINTECH Circle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Heebo:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Brand Colors */
            --onyx: #000000;
            --cloud: #C6C8C9;
            --sky: #22C1C9;
            --ocean: #006BDC;
            --dusk: #724FC2;
            --sun: #FF9A48;

            /* Semantic Variables - Dark Theme */
            --ink: #ffffff;
            --ivory: var(--onyx);
            --gold: var(--sky);
            --gold-light: var(--ocean);
            --slate: #121212;
            --muted: #a0a0a0;
            --rule: rgba(198, 200, 201, 0.15);
            --white: #ffffff;
            --card-bg: rgba(26, 26, 26, 0.8);

            /* Layout */
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-accent: 'Heebo', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 18px;
            scroll-behavior: smooth;
        }

        body {
            background: #000000;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(34, 193, 201, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(114, 79, 194, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8));
            background-size: cover;
            background-attachment: fixed;
            color: var(--ink);
            font-family: var(--font-body);
            font-weight: 400;
            line-height: 1.7;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .mesh-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 4rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--rule);
        }

        .nav-brand {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink);
            text-decoration: none;
        }

        .nav-brand span {
            color: var(--cloud);
        }

        .thank-you-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            margin: 120px auto 80px;
            padding: 0 1.5rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .checkmark-animation {
            width: 120px;
            height: 120px;
            margin: 0 auto 3rem;
            position: relative;
        }

        .checkmark-circle {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(34, 193, 201, 0.2);
            border-radius: 50%;
            position: absolute;
            animation: pulse 2s ease-in-out infinite;
        }

        .checkmark-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--sky);
            font-size: 3rem;
            animation: checkmark-appear 1s ease-out 0.5s both;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        @keyframes checkmark-appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .thank-you-title {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            color: var(--sky);
            margin-bottom: 1.5rem;
            text-shadow: 0 0 30px rgba(34, 193, 201, 0.3);
        }

        .thank-you-message {
            font-size: clamp(1.2rem, 2.5vw, 1.5rem);
            color: var(--white);
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .close-instruction {
            font-family: var(--font-accent);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5MFP65RH" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="mesh-grid"></div>

    <nav>
        <a href="index.html" class="nav-brand">FINTECH <span>Circle</span></a>
    </nav>

    <main class="thank-you-container">
        <div class="checkmark-animation">
            <div class="checkmark-circle"></div>
            <i data-lucide="check" class="checkmark-icon"></i>
        </div>

        <h1 class="thank-you-title">Thank You</h1>
        <p class="thank-you-message">Thank you for filling out a questionnaire, we will be in touch.</p>
        <p class="close-instruction">You may now close the tab</p>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
